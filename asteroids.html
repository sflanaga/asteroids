<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Asteroids</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: block;
    color: #fff;
    font-family: "Courier New", monospace;
  }
  body.locked canvas { cursor: none; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Asteroids - single file, wireframe vector graphics
 * Controls: A / Left  = rotate left      D / Right = rotate right
 *           W / Up    = thrust           Space     = fire
 *           S / Down  = shields (uses banked shield time)
 *           M = mute   P = pause         Enter     = start / restart
 * Mouse:    move side to side = rotate   left button  = fire
 *           right button = thrust        back button  = shields
 *           any click captures the pointer; Esc releases it and pauses
 * ------------------------------------------------------------------ */

/* ----------------------------- tuning ----------------------------- */
const FPS_REF        = 60;      // physics tuned at this framerate
const FRICTION       = 1.0;     // 1.0 == momentum is fully conserved
const MAX_SPEED      = 9;       // px/frame speed cap for the ship
const THRUST         = 0.16;    // px/frame^2
const TURN_SPEED     = 4.6;     // degrees per frame
const SHIP_R         = 14;      // ship "radius" (nose distance)
const SHIP_INVULN    = 2.5;     // seconds of respawn invulnerability
const BULLET_SPEED   = 9;       // px/frame, added to ship velocity
const BULLET_RANGE   = 1.5;     // screens a shot travels before it expires
const FIRE_COOLDOWN  = 0.16;    // seconds between shots
const MOUSE_SENS     = 0.0035;  // radians of rotation per pixel of mouse travel
const START_LIVES    = 3;
const SHIELD_PER_WAVE = 3.0;    // seconds of shield banked per wave, cumulative
const SHIELD_R        = 26;     // shield bubble radius
const SHIELD_MIN      = 0.12;   // need at least this much left to raise it
const EXTRA_LIFE_AT  = 10000;   // bonus ship every N points

// Asteroid tiers: index 0 = large, 1 = medium, 2 = small (small is destroyed)
const TIERS = [
  { r: 56, speed: 1.15, score: 20,  verts: 13, children: 2 },
  { r: 30, speed: 1.75, score: 50,  verts: 11, children: 2 },
  { r: 15, speed: 2.45, score: 100, verts: 9,  children: 0 }
];

/* ---------------------------- plumbing ---------------------------- */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const keys = Object.create(null);
const BLOCKED = new Set([
  "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"
]);
window.addEventListener("keydown", e => {
  if (BLOCKED.has(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  onKeyPress(e.code);
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

/* --- mouse: side-to-side steers, left fires, right thrusts, back shields --- */
const mouse = { 0: false, 1: false, 2: false, 3: false, 4: false };
let mouseSteer = 0;      // radians accumulated since the last update, then consumed
let pointerLocked = false;

let pausedByLock = false;   // paused because the pointer escaped, not by the player
let pausedFrom = 1;         // state to return to on resume (STATE.PLAYING by default)
let lockErrorAt = -1e9;     // browsers impose a short cooldown after an Esc exit
let lockErrMsg = "";        // shown on screen - why the last lock attempt failed
let lockTries = 0;

function plainLock(why) {
  if (why && why.message) lockErrMsg = why.message;
  try {
    const r = canvas.requestPointerLock();
    if (r && r.catch) r.catch(e => { lockErrMsg = e.message || String(e); });
  } catch (e) {
    lockErrMsg = e.message || String(e);
  }
}

function wantPointerLock() {
  if (pointerLocked) return;
  if (!canvas.requestPointerLock) { lockErrMsg = "pointer lock unsupported"; return; }
  lockTries++;
  let r;
  // unadjustedMovement bypasses OS mouse acceleration; older browsers ignore
  // or reject the options form, so fall back to the bare call.
  try { r = canvas.requestPointerLock({ unadjustedMovement: true }); }
  catch (e) { plainLock(e); return; }
  if (r && r.catch) r.catch(plainLock);
}

/* --- fullscreen: on a single monitor it keeps the cursor over the page even
   if the lock itself is refused, and some browsers only grant the lock from
   inside fullscreen. --- */
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function enterFullscreen() {
  if (isFullscreen()) return;
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!fn) return;
  try {
    const r = fn.call(el);
    if (r && r.catch) r.catch(() => {});
  } catch (e) { /* user or browser said no */ }
}
function toggleFullscreen() {
  if (isFullscreen()) {
    if (document.exitFullscreen) document.exitFullscreen();
  } else {
    enterFullscreen();
  }
}
// entering fullscreen can drop an existing lock, so re-take it afterwards
document.addEventListener("fullscreenchange", () => {
  if (isFullscreen()) wantPointerLock();
});

// capture the pointer and the screen together
function grabInput() {
  enterFullscreen();
  wantPointerLock();
}

document.addEventListener("pointerlockchange", () => {
  pointerLocked = document.pointerLockElement === canvas;
  document.body.classList.toggle("locked", pointerLocked);
  if (pointerLocked) {
    mouseSteer = 0;                       // discard whatever the jump to lock produced
    lockErrMsg = "";
    if (pausedByLock && state === STATE.PAUSED) {
      state = pausedFrom;                 // recapturing the pointer resumes play
      pausedByLock = false;
    }
  } else {
    for (const b in mouse) mouse[b] = false;
    if (state === STATE.PLAYING || state === STATE.DYING || state === STATE.LEVEL_CLEAR) {
      pausedFrom = state;                 // DYING and LEVEL_CLEAR must resume as themselves
      state = STATE.PAUSED;               // never fly on while the mouse is elsewhere
      pausedByLock = true;
    }
  }
});
document.addEventListener("pointerlockerror", () => {
  lockErrorAt = performance.now();
  if (!lockErrMsg) lockErrMsg = "browser refused the lock (pointerlockerror)";
});

canvas.addEventListener("mousemove", e => {
  // movementX keeps steering relative, so it never runs out of desk
  mouseSteer += (e.movementX || 0) * MOUSE_SENS;
});
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("mousedown", e => {
  e.preventDefault();
  Sound.unlock();
  mouse[e.button] = true;
  grabInput();                            // any button recaptures the pointer
  if (e.button === 0 && (state === STATE.TITLE || state === STATE.GAME_OVER)) resetGame();
});
window.addEventListener("mouseup", e => { mouse[e.button] = false; });
// some browsers map the back button to navigation on mouseup/auxclick too
window.addEventListener("auxclick", e => { if (e.button === 3 || e.button === 4) e.preventDefault(); });

const rand  = (a, b) => a + Math.random() * (b - a);
const randI = (a, b) => Math.floor(rand(a, b + 1));
const TAU = Math.PI * 2;

// How far you travel along (dx, dy) to cross the wrapped playfield exactly once.
// Straight across is W or H; a diagonal is correspondingly longer.
function screenSpan(dx, dy) {
  const m = Math.hypot(dx, dy) || 1;
  const ax = Math.abs(dx) / m, ay = Math.abs(dy) / m;
  return Math.min(ax > 1e-6 ? W / ax : Infinity,
                  ay > 1e-6 ? H / ay : Infinity);
}

// shortest delta across the wrapping playfield
function wrapDelta(d, size) {
  if (d >  size / 2) d -= size;
  if (d < -size / 2) d += size;
  return d;
}
function wrapPos(o) {
  if (o.x < 0) o.x += W; else if (o.x >= W) o.x -= W;
  if (o.y < 0) o.y += H; else if (o.y >= H) o.y -= H;
}
function distWrapped(a, b) {
  const dx = wrapDelta(b.x - a.x, W);
  const dy = wrapDelta(b.y - a.y, H);
  return Math.hypot(dx, dy);
}

/* ------------------------------ audio ----------------------------- */
const Sound = (() => {
  let actx = null, muted = false;
  function ensure() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (muted) return;
    const a = ensure(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  }
  function noise(dur, vol, filterHz) {
    if (muted) return;
    const a = ensure(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, n, a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = filterHz;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start();
  }
  return {
    fire:    () => tone(760, 0.09, "square", 0.05, 220),
    bang:    (tier) => noise(0.22 + tier * 0.12, 0.26 - tier * 0.05, 900 - tier * 200),
    death:   () => { noise(0.7, 0.3, 500); tone(160, 0.6, "sawtooth", 0.12, 40); },
    level:   () => tone(330, 0.18, "triangle", 0.08, 660),
    bonus:   () => { tone(660, 0.1, "square", 0.07); setTimeout(() => tone(990, 0.14, "square", 0.07), 90); },
    thrust:  () => noise(0.05, 0.035, 380),
    shieldUp:   () => tone(180, 0.14, "sine", 0.06, 520),
    shieldHit:  (tier) => { noise(0.18 + tier * 0.06, 0.18, 1600); tone(880, 0.12, "sine", 0.05, 300); },
    shieldOut:  () => tone(420, 0.25, "sine", 0.06, 90),
    shieldHum:  () => tone(90, 0.06, "sine", 0.02),
    unlock:  () => ensure(),
    toggle:  () => { muted = !muted; return muted; },
    isMuted: () => muted
  };
})();

/* ---------------------------- entities ---------------------------- */
function makeAsteroid(x, y, tier) {
  const t = TIERS[tier];
  const n = t.verts;
  const shape = [];
  for (let i = 0; i < n; i++) shape.push(rand(0.68, 1.22)); // per-vertex radius jitter
  const dir = rand(0, TAU);
  const spd = t.speed * rand(0.65, 1.35) * (1 + level * 0.045);
  return {
    x, y, tier,
    r: t.r,
    vx: Math.cos(dir) * spd,
    vy: Math.sin(dir) * spd,
    a: rand(0, TAU),
    spin: rand(-0.028, 0.028),
    shape
  };
}

function spawnAsteroids(count) {
  for (let i = 0; i < count; i++) {
    let x, y, guard = 0;
    do {
      x = rand(0, W);
      y = rand(0, H);
      guard++;
    } while (guard < 120 && distWrapped({ x, y }, ship) < 260);
    asteroids.push(makeAsteroid(x, y, 0));
  }
}

function splitAsteroid(a) {
  score += TIERS[a.tier].score;
  checkBonusLife();
  Sound.bang(a.tier);
  spawnDebris(a.x, a.y, 8 + a.tier * 2, 1 + (2 - a.tier) * 0.5);
  const kids = TIERS[a.tier].children;
  for (let i = 0; i < kids; i++) {
    const child = makeAsteroid(a.x, a.y, a.tier + 1);
    // push halves apart so they visibly separate
    const off = rand(0, TAU);
    child.x += Math.cos(off) * a.r * 0.35;
    child.y += Math.sin(off) * a.r * 0.35;
    child.vx += a.vx * 0.5;
    child.vy += a.vy * 0.5;
    asteroids.push(child);
  }
}

function spawnDebris(x, y, count, scale) {
  for (let i = 0; i < count; i++) {
    const dir = rand(0, TAU);
    const spd = rand(0.6, 3.2) * scale;
    particles.push({
      x, y,
      vx: Math.cos(dir) * spd,
      vy: Math.sin(dir) * spd,
      a: dir,
      spin: rand(-0.3, 0.3),
      len: rand(3, 10) * scale,
      life: rand(0.35, 1.0),
      maxLife: 1.0
    });
  }
}

// bright sparks thrown off where a rock met the bubble
function spawnShieldRing(a) {
  const base = Math.atan2(wrapDelta(a.y - ship.y, H), wrapDelta(a.x - ship.x, W));
  for (let i = 0; i < 10; i++) {
    const dir = base + rand(-0.9, 0.9);
    const spd = rand(1.5, 4.5);
    particles.push({
      x: ship.x + Math.cos(dir) * SHIELD_R,
      y: ship.y + Math.sin(dir) * SHIELD_R,
      vx: Math.cos(dir) * spd, vy: Math.sin(dir) * spd,
      a: dir, spin: rand(-0.2, 0.2), len: rand(3, 8),
      life: rand(0.2, 0.5), maxLife: 0.5
    });
  }
}

function newShip() {
  return {
    x: W / 2, y: H / 2,
    vx: 0, vy: 0,
    a: -Math.PI / 2,     // pointing up
    r: SHIP_R,
    thrusting: false,
    invuln: SHIP_INVULN,
    alive: true,
    blink: 0,
    shielded: false
  };
}

/* ---------------------------- game state -------------------------- */
const STATE = { TITLE: 0, PLAYING: 1, DYING: 2, LEVEL_CLEAR: 3, GAME_OVER: 4, PAUSED: 5 };

let ship, asteroids, bullets, particles;
let score, best = 0, lives, level;
let state, stateTimer, fireTimer, levelText, levelTextTimer, nextBonus;
let shieldTime;      // banked shield seconds, carried across lives and waves
let shieldWasUp;     // edge detection for the power-up / power-down blips

function resetGame() {
  ship = newShip();
  asteroids = [];
  bullets = [];
  particles = [];
  score = 0;
  lives = START_LIVES;
  level = 0;
  nextBonus = EXTRA_LIFE_AT;
  fireTimer = 0;
  shieldTime = 0;
  shieldWasUp = false;
  levelText = "";
  levelTextTimer = 0;
  startLevel();
  state = STATE.PLAYING;
  stateTimer = 0;
  pausedByLock = false;
  grabInput();
}

function startLevel() {
  level++;
  // each round spawns more rocks
  spawnAsteroids(3 + level);
  shieldTime += SHIELD_PER_WAVE;   // cumulative shield bank
  levelText = "WAVE " + level;
  levelTextTimer = 2.0;
  Sound.level();
}

function checkBonusLife() {
  if (score >= nextBonus) {
    lives++;
    nextBonus += EXTRA_LIFE_AT;
    Sound.bonus();
  }
}

function killShip() {
  Sound.death();
  spawnDebris(ship.x, ship.y, 26, 1.4);
  ship.alive = false;
  lives--;
  state = STATE.DYING;
  stateTimer = 1.6;
}

function togglePause() {
  if (state === STATE.PLAYING || state === STATE.DYING || state === STATE.LEVEL_CLEAR) {
    pausedFrom = state;
    state = STATE.PAUSED;
    pausedByLock = false;
  } else if (state === STATE.PAUSED) {
    state = pausedFrom;
    pausedByLock = false;
    grabInput();
  }
}

function onKeyPress(code) {
  Sound.unlock();
  if (code === "KeyM") { Sound.toggle(); return; }
  if (code === "KeyP") { togglePause(); return; }
  if (code === "KeyF") { toggleFullscreen(); return; }
  if ((code === "Enter" || code === "Space") &&
      (state === STATE.TITLE || state === STATE.GAME_OVER)) {
    resetGame();
  }
}

/* ------------------------------ update ---------------------------- */
function update(dt) {
  const f = dt * FPS_REF;   // frame-equivalent step

  if (state === STATE.PAUSED) { mouseSteer = 0; return; }

  if (levelTextTimer > 0) levelTextTimer -= dt;

  const playable = state === STATE.PLAYING;

  /* --- ship --- */
  if (playable && ship.alive) {
    if (keys.KeyA || keys.ArrowLeft)  ship.a -= TURN_SPEED * Math.PI / 180 * f;
    if (keys.KeyD || keys.ArrowRight) ship.a += TURN_SPEED * Math.PI / 180 * f;
    ship.a += mouseSteer;   // mouse travel is already a distance, not a rate

    // shields: held with S / Down, drains the banked reserve
    const wantShield = !!(keys.KeyS || keys.ArrowDown || mouse[3]);
    ship.shielded = wantShield && shieldTime > SHIELD_MIN;
    if (ship.shielded) {
      shieldTime = Math.max(0, shieldTime - dt);
      if (!shieldWasUp) Sound.shieldUp();
      else if (Math.random() < 0.08) Sound.shieldHum();
      if (shieldTime <= SHIELD_MIN) Sound.shieldOut();
    }
    shieldWasUp = ship.shielded;

    ship.thrusting = !!(keys.KeyW || keys.ArrowUp || mouse[2]);
    if (ship.thrusting) {
      ship.vx += Math.cos(ship.a) * THRUST * f;
      ship.vy += Math.sin(ship.a) * THRUST * f;
      if (Math.random() < 0.35) Sound.thrust();
      // engine sparks out the back
      if (Math.random() < 0.6) {
        const bx = ship.x - Math.cos(ship.a) * ship.r;
        const by = ship.y - Math.sin(ship.a) * ship.r;
        particles.push({
          x: bx, y: by,
          vx: ship.vx - Math.cos(ship.a) * rand(1, 3),
          vy: ship.vy - Math.sin(ship.a) * rand(1, 3),
          a: ship.a, spin: 0, len: rand(2, 5),
          life: rand(0.12, 0.3), maxLife: 0.3
        });
      }
    }

    // momentum is conserved (FRICTION == 1), just capped
    if (FRICTION !== 1) {
      const k = Math.pow(FRICTION, f);
      ship.vx *= k; ship.vy *= k;
    }
    const sp = Math.hypot(ship.vx, ship.vy);
    if (sp > MAX_SPEED) {
      ship.vx = ship.vx / sp * MAX_SPEED;
      ship.vy = ship.vy / sp * MAX_SPEED;
    }

    ship.x += ship.vx * f;
    ship.y += ship.vy * f;
    wrapPos(ship);

    if (ship.invuln > 0) {
      ship.invuln -= dt;
      ship.blink += dt;
    }

    /* --- firing --- */
    fireTimer -= dt;
    if ((keys.Space || mouse[0]) && fireTimer <= 0) {
      const nx = ship.x + Math.cos(ship.a) * ship.r;
      const ny = ship.y + Math.sin(ship.a) * ship.r;
      const bvx = ship.vx + Math.cos(ship.a) * BULLET_SPEED;
      const bvy = ship.vy + Math.sin(ship.a) * BULLET_SPEED;
      bullets.push({
        x: nx, y: ny,
        vx: bvx, vy: bvy,
        dist: 0,                                    // distance flown so far
        range: BULLET_RANGE * screenSpan(bvx, bvy)  // measured along its heading
      });
      fireTimer = FIRE_COOLDOWN;
      Sound.fire();
    }
  }

  /* --- bullets --- */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    const mx = b.vx * f, my = b.vy * f;
    b.x += mx;
    b.y += my;
    wrapPos(b);
    b.dist += Math.hypot(mx, my);
    if (b.dist >= b.range) bullets.splice(i, 1);
  }

  /* --- asteroids --- */
  for (const a of asteroids) {
    a.x += a.vx * f;
    a.y += a.vy * f;
    a.a += a.spin * f;
    wrapPos(a);
  }

  /* --- particles --- */
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * f;
    p.y += p.vy * f;
    p.a += p.spin * f;
    p.vx *= Math.pow(0.985, f);
    p.vy *= Math.pow(0.985, f);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  /* --- bullet vs asteroid --- */
  outer:
  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = asteroids.length - 1; j >= 0; j--) {
      const a = asteroids[j];
      if (distWrapped(bullets[i], a) < a.r) {
        bullets.splice(i, 1);
        asteroids.splice(j, 1);
        splitAsteroid(a);   // smallest tier has 0 children -> destroyed
        continue outer;
      }
    }
  }

  /* --- shield vs asteroid: rocks break apart on the bubble --- */
  if (playable && ship.alive && ship.shielded) {
    for (let j = asteroids.length - 1; j >= 0; j--) {
      const a = asteroids[j];
      const d = distWrapped(ship, a);
      if (d < a.r + SHIELD_R) {
        asteroids.splice(j, 1);
        splitAsteroid(a);           // small rocks are destroyed outright
        Sound.shieldHit(a.tier);
        spawnShieldRing(a);
        // kick the fresh chunks away from the ship so they don't re-hit instantly
        const nx = wrapDelta(a.x - ship.x, W) / (d || 1);
        const ny = wrapDelta(a.y - ship.y, H) / (d || 1);
        for (const k of asteroids) {
          const kd = distWrapped(ship, k);
          if (k.tier === a.tier + 1 && kd < SHIELD_R + k.r + 4) {
            const push = 1.6 + k.tier * 0.4;
            k.vx = nx * push + k.vx * 0.3;
            k.vy = ny * push + k.vy * 0.3;
            const clear = SHIELD_R + k.r - kd + 2;
            k.x += nx * clear;
            k.y += ny * clear;
            wrapPos(k);
          }
        }
        // the impact nudges the ship too - momentum has to go somewhere
        ship.vx -= nx * 0.35 * (3 - a.tier);
        ship.vy -= ny * 0.35 * (3 - a.tier);
      }
    }
  }

  /* --- ship vs asteroid --- */
  if (playable && ship.alive && ship.invuln <= 0 && !ship.shielded) {
    for (const a of asteroids) {
      if (distWrapped(ship, a) < a.r + ship.r * 0.7) {
        asteroids.splice(asteroids.indexOf(a), 1);
        splitAsteroid(a);
        killShip();
        break;
      }
    }
  }

  /* --- state machine --- */
  if (state === STATE.DYING) {
    stateTimer -= dt;
    if (stateTimer <= 0) {
      if (lives <= 0) {
        state = STATE.GAME_OVER;
        best = Math.max(best, score);
      } else if (safeToRespawn()) {
        ship = newShip();
        state = STATE.PLAYING;
      }
    }
  } else if (state === STATE.PLAYING && asteroids.length === 0) {
    state = STATE.LEVEL_CLEAR;
    stateTimer = 1.4;
  } else if (state === STATE.LEVEL_CLEAR) {
    stateTimer -= dt;
    if (stateTimer <= 0) {
      startLevel();
      state = STATE.PLAYING;
    }
  }

  endUpdate();
}

function endUpdate() {
  mouseSteer = 0;
}

function safeToRespawn() {
  const c = { x: W / 2, y: H / 2 };
  for (const a of asteroids) if (distWrapped(c, a) < a.r + 150) return false;
  return true;
}

/* ------------------------------ render ---------------------------- */
// Draw a shape at every wrapped offset it could be visible at.
function drawWrapped(x, y, r, fn) {
  const ox = x < r ? 1 : (x > W - r ? -1 : 0);
  const oy = y < r ? 1 : (y > H - r ? -1 : 0);
  for (const dx of ox ? [0, ox] : [0]) {
    for (const dy of oy ? [0, oy] : [0]) {
      ctx.save();
      ctx.translate(x + dx * W, y + dy * H);
      fn();
      ctx.restore();
    }
  }
}

function strokePoly(pts, close) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close !== false) ctx.closePath();
  ctx.stroke();
}

function drawAsteroid(a) {
  drawWrapped(a.x, a.y, a.r + 4, () => {
    ctx.rotate(a.a);
    ctx.beginPath();
    const n = a.shape.length;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * TAU;
      const rr = a.r * a.shape[i];
      const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  });
}

function shipOutline(r) {
  return [
    [ r,          0        ],
    [-r * 0.75,   r * 0.7  ],
    [-r * 0.45,   0        ],
    [-r * 0.75,  -r * 0.7  ]
  ];
}

function drawShip(s, alpha) {
  ctx.globalAlpha = alpha;
  drawWrapped(s.x, s.y, s.r + 10, () => {
    ctx.rotate(s.a);
    strokePoly(shipOutline(s.r));
    if (s.shielded) {
      ctx.save();
      ctx.rotate(-s.a);                       // bubble does not spin with the ship
      const low = shieldTime < 1.2;           // flicker when nearly spent
      ctx.globalAlpha = (low && Math.floor(performance.now() / 70) % 2 === 0) ? 0.25 : 0.9;
      ctx.beginPath();
      ctx.arc(0, 0, SHIELD_R + Math.sin(performance.now() / 60) * 1.2, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = (low ? 0.12 : 0.3);
      ctx.beginPath();
      ctx.arc(0, 0, SHIELD_R - 3.5, 0, TAU);
      ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = alpha;
    }
    if (s.thrusting) {
      const flare = rand(0.6, 1.3);
      strokePoly([
        [-s.r * 0.5,  s.r * 0.36],
        [-s.r * (0.9 + flare * 0.7), 0],
        [-s.r * 0.5, -s.r * 0.36]
      ], false);
    }
  });
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = "#fff";

  for (const a of asteroids) drawAsteroid(a);

  ctx.fillStyle = "#fff";
  for (const b of bullets) {
    drawWrapped(b.x, b.y, 3, () => {
      ctx.beginPath();
      ctx.arc(0, 0, 1.7, 0, TAU);
      ctx.fill();
    });
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
    drawWrapped(p.x, p.y, p.len + 2, () => {
      ctx.rotate(p.a);
      ctx.beginPath();
      ctx.moveTo(-p.len / 2, 0);
      ctx.lineTo(p.len / 2, 0);
      ctx.stroke();
    });
  }
  ctx.globalAlpha = 1;

  if (ship.alive && state !== STATE.TITLE && state !== STATE.GAME_OVER) {
    // blink while invulnerable
    const vis = ship.invuln > 0 ? (Math.floor(ship.blink * 12) % 2 === 0 ? 0.35 : 1) : 1;
    drawShip(ship, vis);
  }

  drawHUD();
}

function text(str, x, y, size, align, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = "#fff";
  ctx.font = size + "px 'Courier New', monospace";
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(str, x, y);
  ctx.globalAlpha = 1;
}

// banked shield seconds, one bar segment per second plus a partial tail
function drawShieldMeter() {
  if (state === STATE.TITLE) return;
  const x = 24, y = 100, w = 150, h = 9;
  const cap = Math.max(6, Math.ceil(shieldTime));
  const frac = Math.min(1, shieldTime / cap);
  ctx.globalAlpha = shieldTime > SHIELD_MIN ? 1 : 0.35;
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 1.4;
  ctx.strokeRect(x + 0.5, y + 0.5, w, h);
  ctx.fillStyle = "#fff";
  ctx.fillRect(x + 2, y + 2, Math.max(0, (w - 3) * frac), h - 3);
  ctx.globalAlpha = 1;
  text("SHIELD " + shieldTime.toFixed(1) + "s", x + w + 12, y + h, 14, "left", 0.8);
}

// always-on readout so a refused pointer lock is visible instead of mysterious
function drawInputStatus() {
  const y = H - 20;
  if (pointerLocked) {
    text("MOUSE LOCKED" + (isFullscreen() ? "  \u00b7  FULLSCREEN" : ""), 24, y, 13, "left", 0.4);
  } else {
    text("MOUSE FREE - CLICK TO CAPTURE  (F fullscreen)", 24, y, 13, "left", 0.75);
    if (lockErrMsg) text("lock failed: " + lockErrMsg, 24, y - 18, 12, "left", 0.6);
  }
}

function drawHUD() {
  text(String(score).padStart(6, "0"), 24, 52, 30);

  // remaining lives as little ships
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 1.6;
  for (let i = 0; i < Math.min(lives, 12); i++) {
    ctx.save();
    ctx.translate(34 + i * 22, 78);
    ctx.rotate(-Math.PI / 2);
    strokePoly(shipOutline(9));
    ctx.restore();
  }

  drawShieldMeter();
  drawInputStatus();

  text("WAVE " + level, W - 24, 52, 20, "right");
  if (Sound.isMuted()) text("MUTED", W - 24, 76, 14, "right", 0.6);

  if (levelTextTimer > 0 && state !== STATE.TITLE) {
    text(levelText, W / 2, H / 2 - 60, 34, "center", Math.min(1, levelTextTimer));
  }

  if (state === STATE.TITLE) {
    text("ASTEROIDS", W / 2, H / 2 - 60, 72, "center");
    text("A / ←  rotate left     D / →  rotate right", W / 2, H / 2 + 10, 18, "center", 0.85);
    text("W / ↑  thrust           SPACE  fire", W / 2, H / 2 + 40, 18, "center", 0.85);
    text("S / ↓  shields - each wave banks " + SHIELD_PER_WAVE.toFixed(0) + " more seconds",
         W / 2, H / 2 + 70, 18, "center", 0.85);
    text("P  pause          M  mute          F  fullscreen", W / 2, H / 2 + 100, 18, "center", 0.55);
    text("MOUSE:  move = rotate    left = fire    right = thrust    back = shields",
         W / 2, H / 2 + 132, 16, "center", 0.6);
    text("PRESS ENTER OR CLICK TO START", W / 2, H / 2 + 190, 24, "center",
         0.5 + 0.5 * Math.sin(performance.now() / 300));
  }

  if (state === STATE.PAUSED) {
    const blink = 0.55 + 0.45 * Math.sin(performance.now() / 300);
    if (pausedByLock) {
      text("MOUSE RELEASED", W / 2, H / 2 - 10, 40, "center");
      // Chrome refuses a re-lock for about a second after an Esc exit
      const cooling = performance.now() - lockErrorAt < 1200;
      text(cooling ? "ONE MOMENT..." : "CLICK TO CAPTURE THE MOUSE",
           W / 2, H / 2 + 40, 22, "center", cooling ? 0.5 : blink);
      text("or press P to resume on the keyboard", W / 2, H / 2 + 74, 16, "center", 0.5);
    } else {
      text("PAUSED", W / 2, H / 2, 48, "center");
      if (!pointerLocked) {
        text("CLICK TO CAPTURE THE MOUSE", W / 2, H / 2 + 44, 20, "center", blink * 0.8);
      }
    }
  }

  if (state === STATE.GAME_OVER) {
    text("GAME OVER", W / 2, H / 2 - 20, 56, "center");
    text("SCORE " + score + "     BEST " + best, W / 2, H / 2 + 30, 22, "center", 0.85);
    text("PRESS ENTER TO PLAY AGAIN", W / 2, H / 2 + 90, 20, "center",
         0.5 + 0.5 * Math.sin(performance.now() / 300));
  }
}

/* ------------------------------- loop ----------------------------- */
function initTitle() {
  ship = newShip();
  ship.alive = false;
  asteroids = [];
  bullets = [];
  particles = [];
  score = 0;
  lives = START_LIVES;
  level = 1;
  nextBonus = EXTRA_LIFE_AT;
  fireTimer = 0;
  shieldTime = 0;
  shieldWasUp = false;
  levelText = "";
  levelTextTimer = 0;
  state = STATE.TITLE;
  stateTimer = 0;
  spawnAsteroids(7);   // idle rocks drifting behind the title
}

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;   // clamp after tab switches
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

initTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
